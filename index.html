<style>
:root{
  --bg:#f3f2ec; --surface:#ffffff; --ink:#17160f; --muted:#6b6858; --line:#dddbcf;
  --accent:#f2c200; --accent-ink:#17160f; --stripe:#17160f; --warn:#b4540a; --danger:#b3261e; --ok:#2f6b2f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14130e; --surface:#1f1e17; --ink:#f1efe4; --muted:#a6a290; --line:#38362b;
  --accent:#f2c200; --accent-ink:#17160f; --stripe:#2a2920; --warn:#f0a35c; --danger:#ff8a80; --ok:#8fd18f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130e; --surface:#1f1e17; --ink:#f1efe4; --muted:#a6a290; --line:#38362b;
  --accent:#f2c200; --accent-ink:#17160f; --stripe:#2a2920; --warn:#f0a35c; --danger:#ff8a80; --ok:#8fd18f; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stripe)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--stripe);color:#f1efe4;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background-image:repeating-linear-gradient(-45deg,transparent 0 22px,rgba(242,194,0,.14) 22px 30px)}
header.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:auto;border-radius:4px;background:#fff;padding:2px}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:12px;opacity:.7;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid rgba(241,239,228,.35);background:transparent;color:#f1efe4;border-radius:999px;padding:6px 14px;
  font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.add{border-style:dashed}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:3px;min-width:0}
label.f span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
input.bad{border-color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.catrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.note{font-size:14px;color:var(--muted);margin:0}
.players{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;
  grid-template-columns:64px 1fr 1fr;gap:10px;position:relative}
.card .num input{text-align:center;font-family:var(--display);font-weight:700;font-size:22px;padding:6px 4px}
.card .r2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .acts{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card .acts .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .acts .btns{display:flex;gap:6px}
.warns{grid-column:1/-1;font-size:13px;color:var(--warn);margin:0}
.warns:empty{display:none}
button{font:inherit;cursor:pointer}
.ib{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;min-width:40px;height:36px;padding:0 10px;font-size:15px;font-weight:600}
.ib:disabled{opacity:.35;cursor:default}
.ib.del.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn{border:none;border-radius:10px;padding:12px 16px;font-weight:600;font-size:16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost-danger{color:var(--danger)}
.btn.ghost-danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.addbtn{width:100%;border:2px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:14px;font-weight:600;font-size:16px}
.staff{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center}
.srow input.role{text-transform:uppercase;font-weight:600;text-align:center;padding-inline:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.preview img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{padding-block:10px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bar .btn{padding:12px 6px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.saved{font-size:13px;color:var(--muted)}
@media (max-width:420px){.card{grid-template-columns:58px 1fr}.card .nom{grid-column:2}.card .ape{grid-column:2}.card .num{grid-row:span 2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY="planillas-palmira-v1";
const uid=()=>Math.random().toString(36).slice(2,10);

const ROLES=["DT","AC","PF","DELEGADA"];
function mkSheet(cat){return{id:uid(),cat,players:[],staff:ROLES.map(role=>({id:uid(),role,name:""}))};}

let state;
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const s=JSON.parse(raw); if(s&&Array.isArray(s.sheets)&&s.sheets.length) return s;}}catch(e){}
  const a=mkSheet("2014");
  return{current:a.id,sheets:[a]};
}
let saveT, storageOk=true;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true}catch(e){storageOk=false}
  document.getElementById("savedNote").textContent=storageOk?"Los cambios se guardan solos en este teléfono.":"Este navegador no permite guardar: descargá la planilla antes de cerrar.";},300);}
state=load();
const cur=()=>state.sheets.find(s=>s.id===state.current)||state.sheets[0];

/* ---------- formato ---------- */
const fmtDni=d=>{d=(d||"").replace(/\D/g,"");return d.replace(/\B(?=(\d{3})+(?!\d))/g,".")};
const fmtDate=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return d&&m&&y?`${d}/${m}/${y}`:""};
const cap=s=>(s||"").trim().toLowerCase().replace(/(^|[\s'-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function fullName(p){const a=(p.ape||"").trim().toUpperCase(), n=cap(p.nom); return a&&n?`${a}, ${n}`:(a||n);}

function warnsFor(p,sheet){
  const w=[]; const d=(p.dni||"").replace(/\D/g,"");
  if(!(p.ape||"").trim()) w.push("falta el apellido");
  if(d && (d.length<7||d.length>8)) w.push("el DNI debería tener 7 u 8 números");
  if(!d) w.push("falta el DNI");
  if(!p.fn) w.push("falta la fecha de nacimiento");
  if(p.fn && sheet.cat && /^\d{4}$/.test(sheet.cat) && p.fn.slice(0,4)!==sheet.cat) w.push(`nació en ${p.fn.slice(0,4)}, no en ${sheet.cat}`);
  if(p.n && sheet.players.some(o=>o!==p && o.n && o.n.trim()===p.n.trim())) w.push(`el N° ${p.n} está repetido`);
  return w;
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}kids.forEach(k=>e.append(k));return e}
function field(label,id,value,opts={},onInput){
  const i=el("input",{id,value:value||"",autocomplete:"off",...opts}); i.value=value||"";
  i.addEventListener("input",()=>onInput(i)); return el("label",{class:"f "+(opts["data-cls"]||"")},el("span",{},label),i);
}
function renderTabs(){
  const t=$("tabs"); t.innerHTML="";
  state.sheets.forEach(s=>t.append(el("button",{class:"tab",type:"button","aria-pressed":String(s.id===state.current),onclick:()=>{state.current=s.id;save();renderAll()}},"Cat. "+(s.cat||"—"))));
  t.append(el("button",{class:"tab add",type:"button",onclick:newSheet},"+ Nueva"));
}
function newSheet(){
  const s=mkSheet("");
  state.sheets.push(s);state.current=s.id;save();renderAll();$("cat").focus();toast("Planilla nueva: poné la categoría y cargá los jugadores");
}
let armedSheet=false;
$("dup").onclick=()=>{const c=cur();const s=JSON.parse(JSON.stringify(c));s.id=uid();s.cat=c.cat?String(+c.cat-1):"";s.players.forEach(p=>p.id=uid());s.staff.forEach(p=>p.id=uid());
  state.sheets.push(s);state.current=s.id;save();renderAll();toast("Copia creada: Cat. "+(s.cat||"—"));};
$("delsheet").onclick=e=>{const b=e.currentTarget;
  if(state.sheets.length<2){toast("Tiene que quedar al menos una planilla");return}
  if(!armedSheet){armedSheet=true;b.classList.add("armed");b.textContent="¿Seguro?";setTimeout(()=>{armedSheet=false;b.classList.remove("armed");b.textContent="Eliminar"},3000);return}
  armedSheet=false;const c=cur();state.sheets=state.sheets.filter(s=>s!==c);state.current=state.sheets[0].id;save();renderAll();toast("Planilla eliminada");};
$("cat").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4);cur().cat=e.target.value;save();renderTabs();refreshWarns();schedule()});

function renderPlayers(){
  const s=cur(), box=$("players"); box.innerHTML="";
  if(!s.players.length){box.append(el("div",{class:"empty"},"Todavía no hay jugadores. Tocá “Agregar jugador” para cargar el primero."))}
  s.players.forEach((p,i)=>{
    const upd=()=>{save();refreshWarns();schedule()};
    const c=el("div",{class:"card","data-id":p.id});
    c.append(
      field("N°","n-"+p.id,p.n,{inputmode:"numeric",maxlength:"3","data-cls":"num"},i0=>{i0.value=i0.value.replace(/\D/g,"");p.n=i0.value;upd()}),
      field("Apellido","a-"+p.id,p.ape,{autocapitalize:"characters","data-cls":"ape"},i0=>{p.ape=i0.value;upd()}),
      field("Nombre","o-"+p.id,p.nom,{autocapitalize:"words","data-cls":"nom"},i0=>{p.nom=i0.value;upd()}),
      el("div",{class:"r2"},
        field("DNI","d-"+p.id,fmtDni(p.dni),{inputmode:"numeric",maxlength:"10"},i0=>{const d=i0.value.replace(/\D/g,"").slice(0,8);p.dni=d;i0.value=fmtDni(d);upd()}),
        field("Nacimiento","f-"+p.id,p.fn,{type:"date"},i0=>{p.fn=i0.value;upd()})),
      el("p",{class:"warns",id:"w-"+p.id}),
      el("div",{class:"acts"},el("span",{class:"pos"},`Fila ${i+1}`),
        el("div",{class:"btns"},
          (()=>{const b=el("button",{class:"ib",type:"button","aria-label":"Subir",onclick:()=>move(i,-1)},"↑");if(i===0)b.disabled=true;return b})(),
          (()=>{const b=el("button",{class:"ib",type:"button","aria-label":"Bajar",onclick:()=>move(i,1)},"↓");if(i===s.players.length-1)b.disabled=true;return b})(),
          el("button",{class:"ib del",type:"button",onclick:e=>{const b=e.currentTarget;
            if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="¿Quitar?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Quitar"}},3000);return}
            s.players.splice(i,1);save();renderPlayers();schedule();toast("Jugador quitado")}},"Quitar")))
    );
    box.append(c);
  });
  $("pcount").textContent=s.players.length+(s.players.length===1?" jugador":" jugadores");
  refreshWarns();
}
function move(i,d){const a=cur().players;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderPlayers();schedule();
  const c=document.querySelector(`[data-id="${a[j].id}"]`);c&&c.scrollIntoView({block:"center",behavior:"smooth"});}
$("addp").onclick=()=>{const s=cur();if(s.players.length>=30){toast("La planilla admite hasta 30 jugadores");return}
  const p={id:uid(),ape:"",nom:"",dni:"",fn:"",n:""};s.players.push(p);save();renderPlayers();schedule();
  const i=$("n-"+p.id);i.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>i.focus(),250);};
function refreshWarns(){
  const s=cur();let n=0;
  s.players.forEach(p=>{const w=warnsFor(p,s);n+=w.length?1:0;const e=$("w-"+p.id);if(e)e.textContent=w.length?"Revisar: "+w.join(" · "):"";
    const d=$("d-"+p.id);if(d){const dd=(p.dni||"").replace(/\D/g,"");d.classList.toggle("bad",!!dd&&(dd.length<7||dd.length>8))}});
  $("pwarn").textContent=n?`${n} ${n===1?"jugador":"jugadores"} para revisar`:"Todo completo";
  $("pwarn").style.color=n?"var(--warn)":"var(--ok)";
}
function renderStaff(){
  const s=cur(), box=$("staff");box.innerHTML="";
  s.staff.forEach((m,i)=>{
    const r=el("input",{class:"role",id:"r-"+m.id,"aria-label":"Cargo",maxlength:"10",autocapitalize:"characters"});r.value=m.role;
    r.addEventListener("input",()=>{m.role=r.value;save();schedule()});
    const n=el("input",{id:"m-"+m.id,"aria-label":"Nombre","autocapitalize":"characters",autocomplete:"off"});n.value=m.name;
    n.addEventListener("input",()=>{m.name=n.value;save();schedule()});
    box.append(el("div",{class:"srow"},r,n,el("button",{class:"ib",type:"button","aria-label":"Quitar integrante",onclick:()=>{s.staff.splice(i,1);save();renderStaff();schedule()}},"✕")));
  });
}
$("adds").onclick=()=>{const s=cur();if(s.staff.length>=8)return;const m={id:uid(),role:"",name:""};s.staff.push(m);save();renderStaff();schedule();$("r-"+m.id).focus()};
function renderAll(){$("cat").value=cur().cat||"";renderTabs();renderPlayers();renderStaff();schedule(true)}

const W=1240,H=1754;
const imgs={};
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function fitText(ctx,txt,x,y,maxW,size,weight,align="left"){
  let s=size;ctx.font=`${weight} ${s}px Archivo, Arial, sans-serif`;
  while(ctx.measureText(txt).width>maxW&&s>12){s-=1;ctx.font=`${weight} ${s}px Archivo, Arial, sans-serif`}
  ctx.textAlign=align;ctx.fillText(txt,x,y);
}
function draw(){
  const s=cur(), cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  c.fillStyle="#fff";c.fillRect(0,0,W,H);c.fillStyle="#000";c.textBaseline="alphabetic";
  const L=56,R=W-56,TW=R-L;
  c.font="500 54px Archivo, Arial, sans-serif";c.textAlign="left";
  const title="CLUB ATLÉTICO PALMIRA";c.fillText(title,L+40,150);
  c.font="400 26px Archivo, Arial, sans-serif";c.fillText("COCO PASCUTTINI - ROSARIO CENTRAL",L,190);
  const tw=Math.max(c.measureText("COCO PASCUTTINI - ROSARIO CENTRAL").width,(c.font="500 54px Archivo, Arial, sans-serif",c.measureText(title).width+40));
  const lh=130, lx=L+tw+70;
  if(imgs.cap){const w=lh*imgs.cap.width/imgs.cap.height;c.drawImage(imgs.cap,lx,72,w,lh);
    if(imgs.carc){const w2=lh*imgs.carc.width/imgs.carc.height;c.drawImage(imgs.carc,lx+w+26,72,w2,lh)}}
  c.font="400 27px Archivo, Arial, sans-serif";c.fillText("LISTA DE BUENA FE",L,270);c.fillText("CAT. "+(s.cat||""),L+290,270);
  const cols=[0,.325,.545,.89,1].map(f=>L+f*TW);
  const top=322, rows=Math.max(s.players.length+1,16);
  const maxH=H-top-440; const rh=Math.min(42,Math.floor(maxH/(rows+1)));
  const fs=Math.min(27,Math.round(rh*.64));
  c.font=`400 ${fs}px Archivo, Arial, sans-serif`;
  const headY=top, hh=rh;
  const txtY=(y)=>y+rh*.74;
  fitText(c,"NOMBRE COMPLETO",cols[0]+6,txtY(headY),cols[1]-cols[0]-12,fs,400);
  fitText(c,"DNI",(cols[1]+cols[2])/2,txtY(headY),cols[2]-cols[1]-12,fs,400,"center");
  fitText(c,"FECHA DE NACIMIENTO",(cols[2]+cols[3])/2,txtY(headY),cols[3]-cols[2]-12,fs,400,"center");
  fitText(c,"N°",(cols[3]+cols[4])/2,txtY(headY),cols[4]-cols[3]-8,fs,400,"center");
  s.players.forEach((p,i)=>{const y=headY+hh+i*rh;
    fitText(c,fullName(p),cols[0]+6,txtY(y),cols[1]-cols[0]-12,fs,400);
    fitText(c,fmtDni(p.dni),cols[1]+10,txtY(y),cols[2]-cols[1]-16,fs,400);
    fitText(c,fmtDate(p.fn),cols[2]+10,txtY(y),cols[3]-cols[2]-16,fs,400);
    fitText(c,(p.n||"").trim(),(cols[3]+cols[4])/2,txtY(y),cols[4]-cols[3]-8,fs,400,"center");});
  const bottom=headY+hh+rows*rh;
  c.strokeStyle="#333";c.lineWidth=2.4;
  for(let i=1;i<=rows;i++){const y=headY+hh+(i-1)*rh;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke()}
  cols.slice(1,-1).forEach(x=>{c.beginPath();c.moveTo(x,headY);c.lineTo(x,bottom);c.stroke()});
  c.lineWidth=3.2;c.strokeStyle="#222";c.strokeRect(L,headY,TW,bottom-headY);
  const st=s.staff.filter(m=>(m.role||"").trim()||(m.name||"").trim());
  const sw=Math.round(TW*.41), sy=bottom+40, srh=40;
  c.font="400 26px Archivo, Arial, sans-serif";
  fitText(c,"CUERPO TÉCNICO",L+sw/2,sy+srh*.74,sw-12,26,400,"center");
  st.forEach((m,i)=>{const y=sy+srh*(i+1);const role=(m.role||"").trim().toUpperCase(), nm=(m.name||"").trim().toUpperCase();
    fitText(c,role?`${role}: ${nm}`:nm,L+6,y+srh*.74,sw-12,26,400)});
  c.lineWidth=2.4;c.strokeStyle="#333";
  for(let i=1;i<=st.length;i++){const y=sy+srh*i;c.beginPath();c.moveTo(L,y);c.lineTo(L+sw,y);c.stroke()}
  c.lineWidth=3.2;c.strokeStyle="#222";c.strokeRect(L,sy,sw,srh*(st.length+1));
  return cv;
}
let lastCanvas=null,drawT,lastUrl;
function schedule(now){clearTimeout(drawT);drawT=setTimeout(()=>{lastCanvas=draw();lastCanvas.toBlob(b=>{if(!b)return;if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(b);$("prev").src=lastUrl},"image/png")},now?0:350)}

const fname=ext=>`Lista de Buena Fe Cat ${cur().cat||"sin categoria"}.${ext}`;
let toastT;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2800)}
const isPhone=matchMedia("(pointer:coarse)").matches;
function download(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function offer(ext,blob){
  const name=fname(ext);
  const mime=ext==="pdf"?"application/pdf":"image/png";
  if(isPhone&&navigator.canShare){
    try{const f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  download(name,blob);toast(ext==="pdf"?"PDF descargado":"Imagen descargada");
}
$("dlPng").onclick=()=>{const cv=draw();cv.toBlob(b=>offer("png",b),"image/png")};
$("dlPdf").onclick=()=>{
  if(!window.jspdf){toast("El PDF no cargó. Probá con “Imagen”.");return}
  const cv=draw();const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
  pdf.addImage(cv.toDataURL("image/jpeg",.95),"JPEG",0,0,210,297);offer("pdf",pdf.output("blob"));
};
$("goPrev").onclick=()=>$("prevsec").scrollIntoView({behavior:"smooth",block:"start"});

(async()=>{
  renderAll();
  const [a,b]=await Promise.all([loadImg(LOGO_CAP),loadImg(LOGO_CARC)]);imgs.cap=a;imgs.carc=b;
  try{await Promise.all(["400 27px Archivo","500 54px Archivo"].map(f=>document.fonts.load(f)))}catch(e){}
  schedule(true);
})();
$("bkSave").onclick=()=>{const d=new Date().toISOString().slice(0,10);download(`planillas-palmira-${d}.json`,new Blob([JSON.stringify(state,null,1)],{type:"application/json"}));toast("Copia guardada en Descargas")};
$("bkLoad").onclick=()=>$("bkFile").click();
$("bkFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const s=JSON.parse(await f.text());if(!s||!Array.isArray(s.sheets)||!s.sheets.length)throw 0;
    state=s;if(!state.sheets.some(x=>x.id===state.current))state.current=state.sheets[0].id;save();renderAll();toast("Copia recuperada")}
  catch(err){toast("Ese archivo no es una copia de las planillas")}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
